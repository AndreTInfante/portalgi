<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PortalIBL POC — portal-linked convex-hull cubemaps</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%;
    overscroll-behavior: none; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.8);
    transition: background 80ms;
  }
  #crosshair.grab { background: #7fd4ff; box-shadow: 0 0 6px #7fd4ff; }
  #help {
    position: absolute; left: 12px; bottom: 12px; color: rgba(255,255,255,0.75);
    font-size: 12px; line-height: 1.5; text-shadow: 0 1px 2px #000;
  }
  #fps {
    position: absolute; left: 12px; top: 10px; color: rgba(255,255,255,0.8);
    font-size: 12px; text-shadow: 0 1px 2px #000; white-space: pre;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75); color: #eee; font-size: 18px; pointer-events: auto;
    flex-direction: column; gap: 10px; text-align: center;
  }
  #overlay small { color: #999; font-size: 13px; line-height: 1.6; }
  #err {
    position: absolute; left: 12px; top: 40px; right: 12px; color: #ff7070;
    font: 12px/1.4 monospace; white-space: pre-wrap; text-shadow: 0 1px 2px #000;
  }
  #mute {
    position: absolute; right: 260px; top: 6px; pointer-events: auto;
    font-size: 19px; line-height: 1; padding: 5px; cursor: pointer;
    text-shadow: 0 1px 2px #000; user-select: none; opacity: 0.85;
  }
  #mute:hover { opacity: 1; }
  #about {
    position: absolute; right: 300px; top: 9px; pointer-events: auto;
    font: 13px system-ui, sans-serif; line-height: 1; padding: 5px 10px;
    color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
    text-decoration: none; user-select: none;
  }
  #about:hover { background: rgba(0,0,0,0.55); }
  /* floating virtual joystick (touch devices; spawned where the thumb lands) */
  #joy-base, #joy-nub {
    position: absolute; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #joy-base { width: 110px; height: 110px; border: 2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.06); }
  #joy-nub { width: 44px; height: 44px; background: rgba(255,255,255,0.4); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud">
  <div id="crosshair" class="hidden"></div>
  <div id="fps"></div>
  <div id="err"></div>
  <div id="mute" class="hidden" title="toggle audio"></div>
  <a id="about" class="hidden" target="_blank" rel="noopener"
     href="./writeup.html">what am I looking at?</a>
  <div id="help" class="hidden">WASD move &nbsp;·&nbsp; mouse look &nbsp;·&nbsp; click / E grab &nbsp;·&nbsp; click throw &nbsp;·&nbsp; RMB drop &nbsp;·&nbsp; scroll pull/push &nbsp;·&nbsp; V noclip &nbsp;·&nbsp; Esc release mouse</div>
  <div id="touch-help" class="hidden">left thumb to move &nbsp;·&nbsp; swipe to look &nbsp;·&nbsp; tap an object to pick up / drop</div>
  <div id="joy-base" class="hidden"></div>
  <div id="joy-nub" class="hidden"></div>
  <div id="overlay"><div id="overlay-msg">Loading…</div><small id="overlay-sub"></small></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "lil-gui": "./libs/lil-gui.esm.js"
  }
}
</script>
<script>
  // surface console errors on the page (headless screenshots can't see devtools)
  const rawWarn = console.warn.bind(console);
  console.warn = (...a) => {
    const msg = a.map(x => String(x && x.message || x)).join(' ');
    // driver shader-compile WARNINGS (ANGLE/D3D X4000 "potentially
    // uninitialized" false positives on compiler temps, X3595 gradients)
    // stay in the devtools console but not on the demo overlay - programs
    // that actually FAIL arrive via console.error and always show
    if (!/Program Info Log:[^]*warning X\d/.test(msg)) {
      document.getElementById('err').textContent += 'warn: ' + msg.slice(0, 500) + '\n';
    }
    rawWarn(...a);
  };
  const rawErr = console.error.bind(console);
  console.error = (...a) => {
    document.getElementById('err').textContent +=
      a.map(x => String(x && x.message || x)).join(' ').slice(0, 1500) + '\n';
    rawErr(...a);
  };
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    el.textContent += (e.message || String(e)) + (e.filename ? '  @ ' + e.filename + ':' + e.lineno : '') + '\n';
  });
  window.addEventListener('unhandledrejection', (e) => {
    document.getElementById('err').textContent += 'Promise rejection: ' + (e.reason && e.reason.stack || e.reason) + '\n';
  });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
