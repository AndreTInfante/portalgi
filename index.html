  #overlay-bg::after { /* dark scrim so the status text stays legible over it */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.34), rgba(0,0,0,0.66));
  }
  #overlay-msg, #overlay-sub, #loadbar { position: relative; z-index: 1; }
  #overlay small { color: #d0d0d0; font-size: 13px; line-height: 1.6; }
  /* indeterminate progress bar: transform-animated, so it keeps sliding on the
     compositor thread even while the main thread is blocked compiling shaders */
  #loadbar {
    width: 200px; height: 3px; margin-top: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.16); overflow: hidden;
  }
  #loadbar > i {
    display: block; height: 100%; width: 38%; border-radius: 2px;
    background: rgba(255,255,255,0.82); will-change: transform;
    animation: loadslide 1.15s ease-in-out infinite;
  }
  @keyframes loadslide {
    0% { transform: translateX(-115%); } 100% { transform: translateX(375%); }
  }
  #err {
    position: absolute; left: 12px; top: 40px; right: 12px; color: #ff7070;

  }

  #about:hover { background: rgba(0,0,0,0.55); }
  /* floating virtual joystick (touch devices; spawned where the thumb lands) */
  #joy-base, #joy-nub {
    position: absolute; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #joy-base { width: 110px; height: 110px; border: 2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.06); }

{
  "imports": {
    "three": "./libs/three.module.js",

<script>
  // The #err box mirrors console errors/warnings on-screen (headless
  // screenshots can't see devtools). Ordinary visitors shouldn't be shown a
  // wall of red text, so it stays hidden unless explicitly requested with
  // ?errors (alias ?showerrors). Text still accumulates in textContent either
  // way - the ?mark CI heartbeat uploads it and the real devtools console
  // still gets everything - so only the on-screen display is gated.
  {
    const q = new URLSearchParams(location.search);
    if (q.has('errors') || q.has('showerrors')) {
      document.getElementById('err').classList.remove('hidden');
    }
  }

  // surface console errors on the page (headless screenshots can't see devtools)
  const rawWarn = console.warn.bind(console);
  console.warn = (...a) => {
    const msg = a.map(x => String(x && x.message || x)).join(' ');
    // driver shader-compile WARNINGS (ANGLE/D3D X4000 "potentially
    // uninitialized" false positives on compiler temps, X3595 gradients)
    // stay in the devtools console but not on the demo overlay - programs
    // that actually FAIL arrive via console.error and always show
    if (!/Program Info Log:[^]*warning X\d/.test(msg)) {
      document.getElementById('err').textContent += 'warn: ' + msg.slice(0, 500) + '\n';
    }
    rawWarn(...a);
  };
  const rawErr = console.error.bind(console);
  console.error = (...a) => {
    document.getElementById('err').textContent +=
      a.map(x => String(x && x.message || x)).join(' ').slice(0, 1500) + '\n';
    rawErr(...a);
  };
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    el.textContent += (e.message || String(e)) + (e.filename ? '  @ ' + e.filename + ':' + e.lineno : '') + '\n';
  });
  window.addEventListener('unhandledrejection', (e) => {
    document.getElementById('err').textContent += 'Promise rejection: ' + (e.reason && e.reason.stack || e.reason) + '\n';
  });
</script>
<script type="module" src="./src/main.js"></script>
</body>
